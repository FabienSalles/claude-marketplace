name: Validate Marketplace

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

jobs:
  validate-structure:
    name: Validate structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate marketplace.json exists and is valid JSON
        run: |
          jq empty .claude-plugin/marketplace.json
          echo "✓ marketplace.json is valid JSON"

      - name: Validate each plugin has plugin.json
        run: |
          errors=0
          for plugin_dir in plugins/*/; do
            plugin_name=$(basename "$plugin_dir")
            plugin_json="$plugin_dir.claude-plugin/plugin.json"
            if [[ ! -f "$plugin_json" ]]; then
              echo "✗ Missing: $plugin_json"
              errors=$((errors + 1))
            else
              if ! jq empty "$plugin_json" 2>/dev/null; then
                echo "✗ Invalid JSON: $plugin_json"
                errors=$((errors + 1))
              else
                echo "✓ $plugin_name — plugin.json valid"
              fi
            fi
          done
          if [[ $errors -gt 0 ]]; then
            echo "::error::$errors plugin.json errors found"
            exit 1
          fi

      - name: Validate SKILL.md frontmatter
        run: |
          errors=0
          total=0
          for skill_md in $(find plugins -name "SKILL.md" | sort); do
            total=$((total + 1))
            skill_dir=$(dirname "$skill_md")
            skill_name=$(basename "$skill_dir")

            # Check frontmatter exists (starts with ---)
            if ! head -1 "$skill_md" | grep -q '^---$'; then
              echo "✗ Missing frontmatter: $skill_md"
              errors=$((errors + 1))
              continue
            fi

            # Extract frontmatter (only first --- block, using awk to avoid matching code blocks)
            frontmatter=$(awk '/^---$/{if(++n==2) exit; next} n==1' "$skill_md")

            # Check name field
            fm_name=$(echo "$frontmatter" | grep '^name:' | sed 's/^name: *//')
            if [[ -z "$fm_name" ]]; then
              echo "✗ Missing name in frontmatter: $skill_md"
              errors=$((errors + 1))
              continue
            fi

            # Validate name format: lowercase alphanumeric + hyphens, max 64 chars
            if ! echo "$fm_name" | grep -qE '^[a-z0-9.-]+$'; then
              echo "✗ Invalid name format '$fm_name': $skill_md (must match ^[a-z0-9.-]+$)"
              errors=$((errors + 1))
            fi
            if [[ ${#fm_name} -gt 64 ]]; then
              echo "✗ Name too long (${#fm_name} > 64): $skill_md"
              errors=$((errors + 1))
            fi

            # Check description field
            fm_desc=$(echo "$frontmatter" | grep '^description:' | sed 's/^description: *//')
            if [[ -z "$fm_desc" ]]; then
              echo "✗ Missing description in frontmatter: $skill_md"
              errors=$((errors + 1))
              continue
            fi

            # Validate name matches directory name (Agent Skills spec requirement)
            if [[ "$fm_name" != "$skill_name" ]]; then
              echo "✗ Name mismatch: frontmatter '$fm_name' != directory '$skill_name': $skill_md"
              errors=$((errors + 1))
            fi

            echo "✓ $skill_name — frontmatter valid"
          done

          echo ""
          echo "Validated $total skills, $errors errors"
          if [[ $errors -gt 0 ]]; then
            exit 1
          fi

      - name: Validate README skill counts match actual files
        run: |
          errors=0
          # Parse README table: lines matching "| **pack** | N |"
          while IFS='|' read -r _ pack count _ ; do
            pack=$(echo "$pack" | sed 's/[* ]//g')
            count=$(echo "$count" | tr -d ' ')
            # Skip non-numeric (common pack uses —)
            if ! echo "$count" | grep -qE '^[0-9]+$'; then
              continue
            fi
            actual=$(find "plugins/$pack" -name "SKILL.md" 2>/dev/null | wc -l)
            if [[ "$actual" -ne "$count" ]]; then
              echo "✗ README says $pack has $count skills, but found $actual"
              errors=$((errors + 1))
            else
              echo "✓ $pack: $count skills (matches)"
            fi
          done < <(grep -E '^\| \*\*' README.md)

          if [[ $errors -gt 0 ]]; then
            echo "::error::$errors README skill count mismatches"
            exit 1
          fi
          echo "All README counts match actual files"

      - name: Validate marketplace references exist
        run: |
          errors=0
          # Only validate local paths; remote sources (e.g. GitHub) are objects.
          for source in $(jq -r '.plugins[] | select(.source | type == "string") | .source' .claude-plugin/marketplace.json); do
            if [[ ! -d "$source" ]]; then
              echo "✗ marketplace.json references non-existent: $source"
              errors=$((errors + 1))
            else
              echo "✓ $source exists"
            fi
          done
          if [[ $errors -gt 0 ]]; then
            echo "::error::$errors broken marketplace references"
            exit 1
          fi

  test-setup-script:
    name: Test setup.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Test --all registers marketplace and enables every pack
        run: |
          export CLAUDE_HOME=$(mktemp -d)
          ./setup.sh --all

          settings="$CLAUDE_HOME/settings.json"
          if [[ ! -f "$settings" ]]; then
            echo "::error::settings.json not created"
            exit 1
          fi

          mp_path=$(jq -r '.extraKnownMarketplaces["fabien-claude-marketplace"].source.path // empty' "$settings")
          mp_source=$(jq -r '.extraKnownMarketplaces["fabien-claude-marketplace"].source.source // empty' "$settings")
          if [[ "$mp_source" != "directory" ]] || [[ "$mp_path" != "$(pwd)" ]]; then
            echo "::error::Marketplace not registered correctly (source=$mp_source path=$mp_path)"
            exit 1
          fi
          echo "✓ Marketplace registered: directory → $mp_path"

          for pack in php typescript astro nest frontend vitest tooling common; do
            val=$(jq -r --arg k "${pack}@fabien-claude-marketplace" '.enabledPlugins[$k] // empty' "$settings")
            if [[ "$val" != "true" ]]; then
              echo "::error::$pack not enabled (value=$val)"
              exit 1
            fi
          done
          echo "✓ All 8 plugin packs enabled"

          statusline_cmd=$(jq -r '.statusLine.command // empty' "$settings")
          if [[ "$statusline_cmd" != "$(pwd)/plugins/statusline/statusline.sh" ]]; then
            echo "::error::statusLine.command incorrect ($statusline_cmd)"
            exit 1
          fi
          echo "✓ statusLine wired"

          symlinks=$(find "$CLAUDE_HOME" -type l 2>/dev/null | wc -l)
          if [[ $symlinks -ne 0 ]]; then
            echo "::error::Setup created $symlinks symlinks — the new mechanism should create none"
            find "$CLAUDE_HOME" -type l
            exit 1
          fi
          echo "✓ Zero symlinks created (marketplace-only registration)"

      - name: Test --pack enables only the selected pack
        run: |
          export CLAUDE_HOME=$(mktemp -d)
          ./setup.sh --pack php

          settings="$CLAUDE_HOME/settings.json"
          enabled=$(jq -r '.enabledPlugins // {} | to_entries[] | select((.key | endswith("@fabien-claude-marketplace")) and .value == true) | .key' "$settings")
          if [[ "$enabled" != "php@fabien-claude-marketplace" ]]; then
            echo "::error::Expected only php enabled, got: $enabled"
            exit 1
          fi
          echo "✓ --pack php: only php enabled"

      - name: Test --remove disables only the named pack
        run: |
          export CLAUDE_HOME=$(mktemp -d)
          ./setup.sh --all
          ./setup.sh --remove php

          settings="$CLAUDE_HOME/settings.json"
          php_val=$(jq -r '.enabledPlugins["php@fabien-claude-marketplace"] // "absent"' "$settings")
          if [[ "$php_val" != "absent" ]]; then
            echo "::error::php still present after --remove (value=$php_val)"
            exit 1
          fi

          remaining=$(jq -r '.enabledPlugins // {} | to_entries[] | select((.key | endswith("@fabien-claude-marketplace")) and .value == true) | .key' "$settings" | wc -l)
          if [[ $remaining -lt 6 ]]; then
            echo "::error::Too few plugins remaining ($remaining) — --remove may have removed too much"
            exit 1
          fi
          echo "✓ --remove php: only php disabled, $remaining other plugins remain"

      - name: Test --remove statusline drops the statusLine key
        run: |
          export CLAUDE_HOME=$(mktemp -d)
          ./setup.sh --pack statusline
          ./setup.sh --remove statusline

          settings="$CLAUDE_HOME/settings.json"
          if jq -e '.statusLine' "$settings" > /dev/null 2>&1; then
            echo "::error::statusLine key still present after --remove statusline"
            exit 1
          fi
          echo "✓ --remove statusline: key removed"

      - name: Test --status runs without error
        run: |
          export CLAUDE_HOME=$(mktemp -d)
          ./setup.sh --all
          ./setup.sh --status
          echo "✓ --status: runs successfully"

      - name: Test idempotency (running --all twice leaves single registration)
        run: |
          export CLAUDE_HOME=$(mktemp -d)
          ./setup.sh --all
          ./setup.sh --all

          settings="$CLAUDE_HOME/settings.json"
          mp_count=$(jq -r '.extraKnownMarketplaces | keys[] | select(. == "fabien-claude-marketplace")' "$settings" | wc -l)
          if [[ $mp_count -ne 1 ]]; then
            echo "::error::Marketplace registered $mp_count times after two --all calls"
            exit 1
          fi
          echo "✓ Idempotent: marketplace registered exactly once"

      - name: Test ts alias resolves to typescript
        run: |
          export CLAUDE_HOME=$(mktemp -d)
          ./setup.sh --pack ts

          settings="$CLAUDE_HOME/settings.json"
          val=$(jq -r '.enabledPlugins["typescript@fabien-claude-marketplace"] // empty' "$settings")
          if [[ "$val" != "true" ]]; then
            echo "::error::ts alias did not enable typescript (value=$val)"
            exit 1
          fi
          echo "✓ ts alias → typescript"

  test-plugin-validate:
    name: Test claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace manifest
        run: |
          claude plugin validate .
          echo "✓ Marketplace manifest valid"

      - name: Validate each plugin
        run: |
          errors=0
          for plugin_dir in plugins/*/; do
            plugin_name=$(basename "$plugin_dir")
            if claude plugin validate "$plugin_dir" 2>&1; then
              echo "✓ $plugin_name — plugin valid"
            else
              echo "✗ $plugin_name — validation failed"
              errors=$((errors + 1))
            fi
            echo ""
          done
          if [[ $errors -gt 0 ]]; then
            echo "::error::$errors plugins failed validation"
            exit 1
          fi

  test-npx-skills:
    name: Test npx skills discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Test skills discovery
        run: |
          npx skills add . --list 2>&1 | tee /tmp/skills-output.txt
          skill_count=$(grep -c "SKILL.md" /tmp/skills-output.txt || echo "0")
          echo "Discovered $skill_count skills"
          if [[ $skill_count -lt 40 ]]; then
            echo "::warning::Expected at least 40 skills discovered, got $skill_count"
          fi
          echo "✓ npx skills add --list completed"

  health-check:
    name: Run health-check.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run health-check.sh
        run: ./scripts/health-check.sh
