name: Validate Marketplace

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

jobs:
  validate-structure:
    name: Validate structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run the checks
        run: npm run verify -- structure

  nightly-skills-certification:
    name: Nightly install and upstream canary
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install every skill in a sandbox
        run: |
          errors=0
          for skill_dir in $(find plugins -type d -path '*/skills/*' -exec test -f '{}/SKILL.md' \; -print | sort); do
            echo "== $skill_dir"
            if node plugins/skills/scripts/certify.ts --install "$skill_dir"; then
              echo "✓ $skill_dir"
            else
              echo "✗ $skill_dir"
              errors=$((errors + 1))
            fi
          done
          if [[ $errors -gt 0 ]]; then
            echo "::error::$errors skill(s) failed sandboxed install"
            exit 1
          fi

      - name: Cross-check against the upstream skills-ref validator
        run: uvx --from git+https://github.com/agentskills/agentskills#subdirectory=skills-ref skills-ref validate plugins

  test-plugin-validate:
    name: Test claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the checks
        run: npm run verify -- plugin-validate

  test-npx-skills:
    name: Test npx skills discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run the checks
        run: npm run verify -- skills-discovery

  test-goal-gate:
    name: Test the goal gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run the checks
        run: npm run verify -- goal-gate

  test-shell-suites:
    name: Run the shell test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run the checks
        run: npm run verify -- shell-suites

  health-check:
    name: Run health-check.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the checks
        run: npm run verify -- health-check
